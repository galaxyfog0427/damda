spring:
  application:
    name: damda
  profiles:
    default: local          # 아무 프로필도 안 주면 local, 서버는 SPRING_PROFILES_ACTIVE=prod
  jpa:
    open-in-view: false     # 11/11 결정: DB 연결은 서비스(트랜잭션) 안에서만
    hibernate:
      ddl-auto: validate    # ADR-0003: 테이블은 Flyway가 만들고 Hibernate는 검사만

springdoc:
  model-converters:
    java-nullable-property-customizer:
      enabled: true     # @Nullable 칸을 계약에 "null 가능" 으로 (ADR-0006 결정 1)
  writer-with-order-by-keys: true     # 계약의 키를 정렬해 매번 같은 파일로 (ADR-0006 결과)
  default-produces-media-type: application/json   # 성공 응답을 JSON으로 적음, ADR-0006, #54)