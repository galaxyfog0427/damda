openapi: 3.1.0
info:
  title: damda API
  version: v1
servers:
- url: /
paths:
  /api/v1/me:
    get:
      operationId: me
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: OK
      tags:
      - me-controller
  /api/v1/me/library:
    get:
      operationId: listLibrary
      parameters:
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelLibraryItemResponse"
          description: OK
      tags:
      - library-controller
  /api/v1/me/library/{templateId}/downloads:
    post:
      operationId: redownload
      parameters:
      - in: path
        name: templateId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DownloadResponse"
          description: OK
      tags:
      - library-controller
  /api/v1/me/withdrawal:
    post:
      operationId: withdraw
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalRequest"
        required: true
      responses:
        "204":
          description: No Content
      tags:
      - me-controller
  /api/v1/members:
    post:
      operationId: signup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
        required: true
      responses:
        "201":
          description: Created
      tags:
      - signup-controller
  /api/v1/password-resets:
    post:
      operationId: requestPasswordReset
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
        required: true
      responses:
        "202":
          description: Accepted
      tags:
      - password-reset-controller
  /api/v1/signup/codes:
    post:
      operationId: sendSignupCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupCodeRequest"
        required: true
      responses:
        "202":
          description: Accepted
      tags:
      - signup-controller
  /api/v1/signup/verifications:
    post:
      operationId: verifySignupCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupVerificationRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SignupVerificationResponse"
          description: OK
      tags:
      - signup-controller
  /api/v1/templates:
    get:
      operationId: list
      parameters:
      - in: query
        name: category
        required: false
        schema:
          type:
          - string
          - "null"
          enum:
          - PLANNER
          - STUDY
          - CAREER
          - WORK
          - LIFE
          - PRESENTATION
      - in: query
        name: format
        required: false
        schema:
          type:
          - string
          - "null"
          enum:
          - NOTION
          - PPT
      - in: query
        name: q
        required: false
        schema:
          type:
          - string
          - "null"
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelTemplateSummaryResponse"
          description: OK
      tags:
      - template-controller
  /api/v1/templates/{id}:
    get:
      operationId: detail
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TemplateDetailResponse"
          description: OK
      tags:
      - template-controller
  /api/v1/templates/{id}/downloads:
    post:
      operationId: download
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DownloadResponse"
          description: OK
      tags:
      - download-controller
components:
  schemas:
    DownloadResponse:
      type: object
      properties:
        addedToLibrary:
          type: boolean
        deliveryType:
          type: string
          enum:
          - FILE
          - LINK
        expiresAt:
          type:
          - string
          - "null"
          format: date-time
        url:
          type: string
      required:
      - addedToLibrary
      - deliveryType
      - expiresAt
      - url
    LibraryItemResponse:
      type: object
      properties:
        format:
          type: string
          enum:
          - NOTION
          - PPT
        templateId:
          type: integer
          format: int64
        thumbnailUrl:
          type:
          - string
          - "null"
        title:
          type: string
      required:
      - format
      - templateId
      - thumbnailUrl
      - title
    MeResponse:
      type: object
      properties:
        email:
          type: string
        id:
          type: integer
          format: int64
        nickname:
          type: string
        roles:
          type: array
          items:
            type: string
            enum:
            - CREATOR
            - ADMIN
          uniqueItems: true
      required:
      - email
      - id
      - nickname
      - roles
    PageMetadata:
      type: object
      properties:
        number:
          type: integer
          format: int64
        size:
          type: integer
          format: int64
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
      required:
      - number
      - size
      - totalElements
      - totalPages
    PagedModelLibraryItemResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/LibraryItemResponse"
        page:
          $ref: "#/components/schemas/PageMetadata"
      required:
      - content
      - page
    PagedModelTemplateSummaryResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/TemplateSummaryResponse"
        page:
          $ref: "#/components/schemas/PageMetadata"
      required:
      - content
      - page
    PasswordResetRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 1
      required:
      - email
    SignupCodeRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 1
      required:
      - email
    SignupRequest:
      type: object
      properties:
        nickname:
          type: string
          maxLength: 20
          minLength: 2
        over14:
          type: boolean
        password:
          type: string
          maxLength: 20
          minLength: 8
        signupToken:
          type: string
          minLength: 1
        termsAgreed:
          type: boolean
      required:
      - nickname
      - over14
      - password
      - signupToken
      - termsAgreed
    SignupVerificationRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          pattern: "^[0-9]{6}$"
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 1
      required:
      - code
      - email
    SignupVerificationResponse:
      type: object
      properties:
        signupToken:
          type: string
      required:
      - signupToken
    TemplateCreatorResponse:
      type: object
      properties:
        name:
          type: string
        official:
          type: boolean
      required:
      - name
      - official
    TemplateDetailResponse:
      type: object
      properties:
        accessType:
          type: string
          enum:
          - GENERAL
          - DROP_ONLY
        category:
          type: string
          enum:
          - PLANNER
          - STUDY
          - CAREER
          - WORK
          - LIFE
          - PRESENTATION
        creator:
          $ref: "#/components/schemas/TemplateCreatorResponse"
        deliveryType:
          type: string
          enum:
          - FILE
          - LINK
        description:
          type: string
        downloadCount:
          type: integer
          format: int64
        format:
          type: string
          enum:
          - NOTION
          - PPT
        id:
          type: integer
          format: int64
        thumbnailUrl:
          type:
          - string
          - "null"
        title:
          type: string
      required:
      - accessType
      - category
      - creator
      - deliveryType
      - description
      - downloadCount
      - format
      - id
      - thumbnailUrl
      - title
    TemplateSummaryResponse:
      type: object
      properties:
        accessType:
          type: string
          enum:
          - GENERAL
          - DROP_ONLY
        category:
          type: string
          enum:
          - PLANNER
          - STUDY
          - CAREER
          - WORK
          - LIFE
          - PRESENTATION
        creator:
          $ref: "#/components/schemas/TemplateCreatorResponse"
        downloadCount:
          type: integer
          format: int64
        format:
          type: string
          enum:
          - NOTION
          - PPT
        id:
          type: integer
          format: int64
        thumbnailUrl:
          type:
          - string
          - "null"
        title:
          type: string
      required:
      - accessType
      - category
      - creator
      - downloadCount
      - format
      - id
      - thumbnailUrl
      - title
    WithdrawalRequest:
      type: object
      properties:
        password:
          type: string
          minLength: 1
      required:
      - password
