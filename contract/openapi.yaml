openapi: 3.1.0
info:
  title: damda API
  version: v1
servers:
- url: /
paths:
  /api/v1/templates/{id}:
    get:
      operationId: detail
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TemplateDetailResponse"
          description: OK
      tags:
      - template-controller
components:
  schemas:
    TemplateDetailResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        thumbnailUrl:
          type:
          - string
          - "null"
        title:
          type: string
      required:
      - id
      - thumbnailUrl
      - title
